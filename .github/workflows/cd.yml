# Template de CD: no despliega a prod hasta tener cluster y credenciales.
# Usar workflow_dispatch cuando exista el entorno.
name: CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Entorno de destino (dev|prod)"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod
      image_tag:
        description: "Tag de imagen a desplegar"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

