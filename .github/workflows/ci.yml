name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [wa-users-service, wa-channel-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build and verify (JaCoCo ≥ 80%)
        run: ./mvnw -B clean verify

  docker:
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [wa-users-service, wa-channel-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${{ matrix.service }}:${{ github.sha }} .

  helm-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: wa-users-service
            chart: services/wa-users-service/helm/wa-users-service
          - service: wa-channel-service
            chart: services/wa-channel-service/helm/wa-channel-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint ${{ matrix.chart }} --set-string env.DB_PASSWORD=lint-only-placeholder
