name: Users service CI
on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish image to GHCR
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/wa-users-service
    services:
      mongo:
        image: mongo:7.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.runCommand({ping:1}).ok ? 0 : 1)'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/wa-users-service/pom.xml
      - name: Verify with real MongoDB
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify
      - name: Require integration tests to execute
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          report = next(Path('target/surefire-reports').glob('TEST-*UserIntegrationTest.xml'))
          suite = ET.parse(report).getroot()
          assert int(suite.attrib['tests']) > 0, 'No integration tests'
          assert int(suite.attrib.get('skipped', 0)) == 0, 'Mongo integration tests skipped'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: users-test-reports
          path: |
            services/wa-users-service/target/surefire-reports/
            services/wa-users-service/target/site/jacoco/
  docker:
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image tag
        id: image
        run: echo "tag=ghcr.io/${GITHUB_REPOSITORY,,}/wa-users-service:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/wa-users-service
          push: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.image.outputs.tag }}
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate chart and both environments
        run: |
          helm lint helm/wa-users-service
          helm lint helm/wa-users-service -f helm/wa-users-service/values-prod.yaml
          helm template users helm/wa-users-service -f helm/wa-users-service/values-dev.yaml
          helm template users helm/wa-users-service -f helm/wa-users-service/values-prod.yaml
