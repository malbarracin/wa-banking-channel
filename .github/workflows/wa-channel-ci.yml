name: wa-channel-service CI
on:
  pull_request:
    paths:
      - 'services/wa-channel-service/**'
      - '.github/workflows/wa-channel-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/wa-channel-service/**'
      - '.github/workflows/wa-channel-ci.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/wa-channel-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw && ./mvnw -q -B clean verify
  docker:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t wa-channel-service:${{ github.sha }} services/wa-channel-service
