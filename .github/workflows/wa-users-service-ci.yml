name: wa-users-service CI

on:
  pull_request:
    paths:
      - "services/wa-users-service/**"
      - ".github/workflows/wa-users-service-ci.yml"
  push:
    branches: [main]
    paths:
      - "services/wa-users-service/**"
      - ".github/workflows/wa-users-service-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wa-users-service-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPONENT_DIR: services/wa-users-service

jobs:
  build-test:
    name: build-test (./mvnw clean verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/wa-users-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/wa-users-service/pom.xml

      - name: Verify (compila, tests, JaCoCo >= 80%)
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify

      - name: Reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wa-users-service-jacoco
          path: services/wa-users-service/target/site/jacoco/
          if-no-files-found: ignore

  helm-lint:
    name: helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint y template del chart
        run: |
          helm lint services/wa-users-service/helm/wa-users-service
          helm template users services/wa-users-service/helm/wa-users-service \
            -f services/wa-users-service/helm/wa-users-service/values-dev.yaml > /dev/null

  docker:
    name: docker image
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Nombre de la imagen
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/wa-users-service" >> "$GITHUB_OUTPUT"

      - name: Login a GHCR (solo en main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (y push en main)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.COMPONENT_DIR }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha,scope=wa-users-service
          cache-to: type=gha,mode=max,scope=wa-users-service
