name: wa-users-service

on:
  push:
    branches: [main, develop]
    paths:
      - "services/wa-users-service/**"
      - "docker-compose.yml"
      - ".github/workflows/wa-users-service.yml"
  pull_request:
    paths:
      - "services/wa-users-service/**"
      - "docker-compose.yml"
      - ".github/workflows/wa-users-service.yml"

permissions:
  contents: read

concurrency:
  group: wa-users-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests y cobertura (./mvnw verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/wa-users-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/wa-users-service/pom.xml
      # Incluye los tests y el control de cobertura de JaCoCo (mínimo 80%).
      - name: ./mvnw verify
        run: |
          chmod +x mvnw
          ./mvnw -B verify
      - name: Reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wa-users-service-jacoco
          path: services/wa-users-service/target/site/jacoco
          if-no-files-found: ignore

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose.yml
        run: docker compose --env-file .env.example config --quiet
        env:
          USERS_DB_NAME: ci
          USERS_DB_USER: ci
          USERS_DB_PASSWORD: ci
      - name: docker build
        run: docker build -t wa-users-service:${{ github.sha }} services/wa-users-service
