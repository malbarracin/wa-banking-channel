[project]
name = "wa-knowledge-rag"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic-settings>=2.8,<3",
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.3,<1",
    "google-genai>=1,<3",
    "structlog>=25,<27",
    "prometheus-client>=0.21,<1",
]

[project.scripts]
kb = "wa_knowledge_rag.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.26,<2",
    "pytest-cov>=6,<8",
    "testcontainers>=4,<5",
    "ruff>=0.11,<1",
    "mypy>=1.15,<3",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: necesita Docker", "evals: usa el modelo real"]
addopts = "-m 'not evals'"

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "wa_knowledge_rag/migrations"
