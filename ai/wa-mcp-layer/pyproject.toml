[project]
name = "wa-mcp-layer"
version = "0.1.0"
description = "Capa MCP del canal bancario"
requires-python = ">=3.12,<3.13"
dependencies = [
    "structlog>=25.1,<26",
    "pydantic-settings>=2.6,<3",
    "httpx>=0.28,<1",
]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.14,<1",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=6,<8",
    "respx>=0.22,<1",
    "testcontainers>=4.9,<5",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"] # pytest usa assert para verificar resultados.

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: necesita Docker", "evals: usa el modelo real"]
addopts = "-m 'not evals'"
