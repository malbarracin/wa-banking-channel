# Canal WhatsApp Bancario — Stack local E2E completo
# Levantar todo el entorno: docker compose up -d --build
# Parar: docker compose down
# Reset (datos): docker compose down -v

networks:
  wa-channel:
    driver: bridge

volumes:
  kafka-data:
  users-postgres-data:
  credentials-postgres-data:
  channel-postgres-data:
  accounts-postgres-data:
  cards-postgres-data:
  insurance-postgres-data:
  kb-postgres-data:
  agent-redis-data:
  gateway-outbound-data:
  orchestrator-db-data:

services:
  # --- Infra compartida: Kafka KRaft ---
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    networks:
      - wa-channel
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.1
    networks:
      - wa-channel
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        BOOT=kafka:29092
        create() {
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$BOOT" --create --if-not-exists \
            --topic "$$1" --partitions 3 --replication-factor 1 \
            --config cleanup.policy=delete --config retention.ms="$$2"
        }
        create wa.message.received.v1 604800000
        create wa.message.ready-to-send.v1 604800000
        create wa.message.status.v1 2592000000
        create wa.message.dlq.v1 7776000000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$BOOT" --list

  # --- Plataforma de integración ---
  wa-event-platform:
    build:
      context: .
      dockerfile: platform/wa-event-platform/Dockerfile
    image: wa-event-platform:local
    networks:
      - wa-channel
    ports:
      - "127.0.0.1:${EVENT_PLATFORM_PORT:-8092}:8092"
    environment:
      SERVER_PORT: 8092
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_ADMIN_AUTO_CREATE: ${KAFKA_ADMIN_AUTO_CREATE:-true}
      KAFKA_ADMIN_FAIL_FAST: ${KAFKA_ADMIN_FAIL_FAST:-true}
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
      KAFKA_TOPIC_REPLICAS: ${KAFKA_TOPIC_REPLICAS:-1}
      KAFKA_RECEIVED_RETENTION: ${KAFKA_RECEIVED_RETENTION:-7d}
      KAFKA_READY_TO_SEND_RETENTION: ${KAFKA_READY_TO_SEND_RETENTION:-7d}
      KAFKA_STATUS_RETENTION: ${KAFKA_STATUS_RETENTION:-30d}
      KAFKA_DLQ_RETENTION: ${KAFKA_DLQ_RETENTION:-90d}
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8092/actuator/health"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

  wa-twilio-gateway:
    build:
      context: .
      dockerfile: gateway/wa-twilio-gateway/Dockerfile
    image: wa-twilio-gateway:local
    networks:
      - wa-channel
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8090}:8090"
    env_file:
      - .env
    environment:
      SERVER_PORT: 8090
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WEBHOOK_PUBLIC_URL: ${TWILIO_WEBHOOK_PUBLIC_URL:-}
      TWILIO_STATUS_CALLBACK_PUBLIC_URL: ${TWILIO_STATUS_CALLBACK_PUBLIC_URL:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      GATEWAY_OUTBOUND_ENABLED: ${GATEWAY_OUTBOUND_ENABLED:-true}
      OUTBOUND_DB_URL: ${OUTBOUND_DB_URL:-jdbc:h2:file:/app/data/outbound;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0}
      WEBHOOK_ANTI_REPLAY_WINDOW_SECONDS: ${WEBHOOK_ANTI_REPLAY_WINDOW_SECONDS:-300}
      WEBHOOK_ANTI_REPLAY_CAPACITY: ${WEBHOOK_ANTI_REPLAY_CAPACITY:-10000}
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: DEBUG
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_HTTP: TRACE
    volumes:
      - gateway-outbound-data:/app/data
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/actuator/health"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

  orchestrator-db:
    image: postgres:17
    networks:
      - wa-channel
    environment:
      POSTGRES_DB: ${ORCHESTRATOR_DB_NAME:-wa_orchestrator}
      POSTGRES_USER: ${ORCHESTRATOR_DB_USER:-orchestrator}
      POSTGRES_PASSWORD: ${ORCHESTRATOR_DB_PASSWORD:?Definir ORCHESTRATOR_DB_PASSWORD en .env}
    volumes:
      - orchestrator-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  wa-channel-orchestrator:
    build:
      context: .
      dockerfile: platform/wa-channel-orchestrator/Dockerfile
    image: wa-channel-orchestrator:local
    networks:
      - wa-channel
    ports:
      - "127.0.0.1:${ORCHESTRATOR_PORT:-8091}:8091"
    env_file:
      - .env
    environment:
      SERVER_PORT: 8091
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://orchestrator-db:5432/${ORCHESTRATOR_DB_NAME:-wa_orchestrator}
      SPRING_DATASOURCE_USERNAME: ${ORCHESTRATOR_DB_USER:-orchestrator}
      SPRING_DATASOURCE_PASSWORD: ${ORCHESTRATOR_DB_PASSWORD:?Definir ORCHESTRATOR_DB_PASSWORD en .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
      H9_BASE_URL: http://wa-conversation-agent:8103
      H9_SERVICE_TOKEN: ${H9_SERVICE_TOKEN:-}
      H9_TIMEOUT_MS: ${H9_TIMEOUT_MS:-5000}
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      orchestrator-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8091/actuator/health"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

  # --- H1–H6 (Servicios Java) ---
  users-postgres:
    image: postgres:16-alpine
    networks:
      - wa-channel
    environment:
      POSTGRES_DB: ${USERS_DB_NAME:-wa_users}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - users-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  wa-users-service:
    build:
      context: ./services/wa-users-service
    image: wa-users-service:local
    networks:
      - wa-channel
    ports:
      - "${USERS_HOST_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      APP_PORT: "8080"
      DB_NAME: ${USERS_DB_NAME:-wa_users}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://users-postgres:5432/${USERS_DB_NAME:-wa_users}
    depends_on:
      users-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

  credentials-postgres:
    image: postgres:16-alpine
    networks:
      - wa-channel
    environment:
      POSTGRES_DB: ${CREDENTIALS_DB_NAME:-wa_credentials}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - credentials-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  wa-credentials-service:
    build:
      context: ./services/wa-credentials-service
    image: wa-credentials-service:local
    networks:
      - wa-channel
    ports:
      - "${CREDENTIALS_HOST_PORT:-8082}:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      PORT: "8082"
      APP_PORT: "8082"
      DB_NAME: ${CREDENTIALS_DB_NAME:-wa_credentials}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CREDENTIAL_JWT_SECRET: ${CREDENTIAL_JWT_SECRET}
      WA_USERS_SERVICE_BASE_URL: http://wa-users-service:8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://credentials-postgres:5432/${CREDENTIALS_DB_NAME:-wa_credentials}
    depends_on:
      credentials-postgres:
        condition: service_healthy
      wa-users-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

  channel-postgres:
    image: postgres:16-alpine
    networks:
      - wa-channel
    environment:
      POSTGRES_DB: ${CHANNEL_DB_NAME:-wa_channel}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - channel-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  wa-channel-service:
    build:
      context: ./services/wa-channel-service
    image: wa-channel-service:local
    networks:
      - wa-channel
    ports:
      - "${CHANNEL_HOST_PORT:-8081}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      PORT: "8081"
      APP_PORT: "8081"
      DB_NAME: ${CHANNEL_DB_NAME:-wa_channel}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      WA_USERS_SERVICE_BASE_URL: http://wa-users-service:8080
      CREDENCIALES_SERVICE_BASE_URL: http://wa-credentials-service:8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://channel-postgres:5432/${CHANNEL_DB_NAME:-wa_channel}
    depends_on:
      channel-postgres:
        condition: service_healthy
      wa-users-service:
        condition: service_healthy
      wa-credentials-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

  accounts-postgres:
    image: postgres:16-alpine
    networks:
      - wa-channel
    environment:
      POSTGRES_DB: ${ACCOUNTS_DB_NAME:-wa_accounts}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - accounts-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  wa-accounts-service:
    build:
      context: ./services/wa-accounts-service
    image: wa-accounts-service:local
    networks:
      - wa-channel
    ports:
      - "${ACCOUNTS_HOST_PORT:-8084}:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      PORT: "8084"
      APP_PORT: "8084"
      DB_NAME: ${ACCOUNTS_DB_NAME:-wa_accounts}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CREDENTIALS_SERVICE_BASE_URL: http://wa-credentials-service:8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://accounts-postgres:5432/${ACCOUNTS_DB_NAME:-wa_accounts}
    depends_on:
      accounts-postgres:
        condition: service_healthy
      wa-credentials-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

  cards-postgres:
    image: postgres:16-alpine
    networks:
      - wa-channel
    environment:
      POSTGRES_DB: ${CARDS_DB_NAME:-wa_cards}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - cards-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  wa-cards-service:
    build:
      context: ./services/wa-cards-service
    image: wa-cards-service:local
    networks:
      - wa-channel
    ports:
      - "${CARDS_HOST_PORT:-8086}:8086"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      PORT: "8086"
      APP_PORT: "8086"
      DB_NAME: ${CARDS_DB_NAME:-wa_cards}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CREDENTIALS_SERVICE_BASE_URL: http://wa-credentials-service:8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://cards-postgres:5432/${CARDS_DB_NAME:-wa_cards}
    depends_on:
      cards-postgres:
        condition: service_healthy
      wa-credentials-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8086/actuator/health"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

  insurance-postgres:
    image: postgres:16-alpine
    networks:
      - wa-channel
    environment:
      POSTGRES_DB: ${INSURANCE_DB_NAME:-wa_insurance}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - insurance-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  wa-insurance-service:
    build:
      context: ./services/wa-insurance-service
    image: wa-insurance-service:local
    networks:
      - wa-channel
    ports:
      - "${INSURANCE_HOST_PORT:-8085}:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      PORT: "8085"
      APP_PORT: "8085"
      DB_NAME: ${INSURANCE_DB_NAME:-wa_insurance}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CREDENTIALS_SERVICE_BASE_URL: http://wa-credentials-service:8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://insurance-postgres:5432/${INSURANCE_DB_NAME:-wa_insurance}
    depends_on:
      insurance-postgres:
        condition: service_healthy
      wa-credentials-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

  # --- IA (H7, H8, H9) ---
  kb-postgres:
    image: pgvector/pgvector:pg17
    networks:
      - wa-channel
    environment:
      POSTGRES_DB: ${KB_DB_NAME:-wa_knowledge}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${KB_DB_HOST_PORT:-5438}:5432"
    volumes:
      - kb-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  wa-knowledge-rag:
    build:
      context: ./ai/wa-knowledge-rag
    image: wa-knowledge-rag:local
    networks:
      - wa-channel
    ports:
      - "${RAG_HOST_PORT:-8102}:8102"
    env_file:
      - .env
    environment:
      PORT: "8102"
      DATABASE_URL: postgresql://${DB_USERNAME}:${DB_PASSWORD}@kb-postgres:5432/${KB_DB_NAME:-wa_knowledge}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-004}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      kb-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8102/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  agent-redis:
    image: redis:8.4
    networks:
      - wa-channel
    ports:
      - "${AGENT_REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - agent-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  agent-memory-server:
    image: redislabs/agent-memory-server:0.15.2
    networks:
      - wa-channel
    ports:
      - "${AGENT_MEMORY_HOST_PORT:-8000}:8000"
    environment:
      REDIS_URL: redis://agent-redis:6379
      DISABLE_AUTH: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      agent-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  wa-mcp-layer:
    build:
      context: ./ai/wa-mcp-layer
    image: wa-mcp-layer:local
    networks:
      - wa-channel
    ports:
      - "${MCP_HOST_PORT:-8101}:8101"
    env_file:
      - .env
    environment:
      PORT: "8101"
      USERS_SERVICE_BASE_URL: http://wa-users-service:8080
      CREDENTIALS_SERVICE_BASE_URL: http://wa-credentials-service:8082
      CHANNEL_SERVICE_BASE_URL: http://wa-channel-service:8081
      ACCOUNTS_SERVICE_BASE_URL: http://wa-accounts-service:8084
      CARDS_SERVICE_BASE_URL: http://wa-cards-service:8086
      INSURANCE_SERVICE_BASE_URL: http://wa-insurance-service:8085
    depends_on:
      wa-users-service:
        condition: service_healthy
      wa-credentials-service:
        condition: service_healthy
      wa-channel-service:
        condition: service_healthy
      wa-accounts-service:
        condition: service_healthy
      wa-cards-service:
        condition: service_healthy
      wa-insurance-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8101/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  wa-conversation-agent:
    build:
      context: ./ai/wa-conversation-agent
    image: wa-conversation-agent:local
    networks:
      - wa-channel
    ports:
      - "${AGENT_HOST_PORT:-8103}:8103"
    env_file:
      - .env
    environment:
      AGENT_PORT: "8103"
      AGENT_MODEL: ${AGENT_MODEL:-gemini-2.5-flash}
      AGENT_MCP_URL: http://wa-mcp-layer:8101/mcp
      AGENT_RAG_URL: http://wa-knowledge-rag:8102
      AGENT_REDIS_URL: redis://agent-redis:6379
      AGENT_MEMORY_SERVER_URL: http://agent-memory-server:8000
      AGENT_MEMORY_KEY_SECRET: ${AGENT_MEMORY_KEY_SECRET:-}
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:-}
      AGENT_SESSION_TTL_MINUTES: ${AGENT_SESSION_TTL_MINUTES:-30}
    depends_on:
      wa-mcp-layer:
        condition: service_healthy
      wa-knowledge-rag:
        condition: service_healthy
      agent-redis:
        condition: service_healthy
      agent-memory-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8103/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
