# Stack local H0: Kafka KRaft + topics del contrato + gateway opcional.
# No hay compose en la raíz del programa; este archivo es autónomo para el gateway.
# Si ya tenés Kafka de platform/wa-event-platform, podés apuntar
# KAFKA_BOOTSTRAP_SERVERS=host.docker.internal:9092 y levantar solo el profile app
# con un override; por defecto se usa el broker de este compose.
# Desde gateway/wa-twilio-gateway:
#   docker compose up -d --wait                    # broker + kafka-init
#   docker compose --profile app up -d --wait      # + wa-twilio-gateway
# Webhooks reales: túnel (ngrok u similar) → TWILIO_WEBHOOK_PUBLIC_URL /
# TWILIO_STATUS_CALLBACK_PUBLIC_URL (ver README y .env.example).
services:
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Topics de shared/contracts/events/topics.md (3 particiones, réplica 1, retención por tiempo).
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        BOOT=kafka:29092
        create() {
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$BOOT" --create --if-not-exists \
            --topic "$$1" --partitions 3 --replication-factor 1 \
            --config cleanup.policy=delete --config retention.ms="$$2"
        }
        create wa.message.received.v1 604800000
        create wa.message.ready-to-send.v1 604800000
        create wa.message.status.v1 2592000000
        create wa.message.dlq.v1 7776000000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$BOOT" --list

  wa-twilio-gateway:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: gateway/wa-twilio-gateway/Dockerfile
    image: wa-twilio-gateway:local
    ports:
      - "127.0.0.1:${SERVER_PORT:-8090}:8090"
    environment:
      SERVER_PORT: 8090
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WEBHOOK_PUBLIC_URL: ${TWILIO_WEBHOOK_PUBLIC_URL:-}
      TWILIO_STATUS_CALLBACK_PUBLIC_URL: ${TWILIO_STATUS_CALLBACK_PUBLIC_URL:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      GATEWAY_OUTBOUND_ENABLED: ${GATEWAY_OUTBOUND_ENABLED:-true}
      OUTBOUND_DB_URL: ${OUTBOUND_DB_URL:-jdbc:h2:file:/app/data/outbound;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0}
      OUTBOUND_DB_USER: ${OUTBOUND_DB_USER:-sa}
      OUTBOUND_DB_PASSWORD: ${OUTBOUND_DB_PASSWORD:-}
      WEBHOOK_ANTI_REPLAY_WINDOW_SECONDS: ${WEBHOOK_ANTI_REPLAY_WINDOW_SECONDS:-300}
      WEBHOOK_ANTI_REPLAY_CAPACITY: ${WEBHOOK_ANTI_REPLAY_CAPACITY:-10000}
    volumes:
      - gateway-outbound-data:/app/data
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/actuator/health"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

volumes:
  kafka-data:
  gateway-outbound-data:
