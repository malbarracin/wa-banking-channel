server:
  port: ${SERVER_PORT:8090}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
spring:
  application:
    name: wa-twilio-gateway
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true
info:
  app:
    name: ${spring.application.name}
logging:
  structured:
    format:
      console: ecs
