server:
  port: ${SERVER_PORT:8090}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
spring:
  datasource:
    url: ${OUTBOUND_DB_URL:jdbc:h2:file:./data/outbound;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0}
    username: ${OUTBOUND_DB_USER:sa}
    password: ${OUTBOUND_DB_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
      properties:
        max.poll.records: 1
        max.poll.interval.ms: 300000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 3000
        max.block.ms: 200
        retry.backoff.ms: 100
  application:
    name: wa-twilio-gateway
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true
info:
  app:
    name: ${spring.application.name}
logging:
  level:
    org.springframework.kafka.listener.DefaultErrorHandler: OFF
    com.twilio: OFF
  structured:
    format:
      console: ecs
