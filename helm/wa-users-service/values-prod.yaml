replicaCount: 2
springProfile: prod
image:
  repository: ghcr.io/your-org/your-repo/wa-users-service
  tag: replace-with-commit-sha
  pullPolicy: IfNotPresent
mongodb:
  existingSecret: wa-users-mongodb-prod
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: '2'
    memory: 1Gi
