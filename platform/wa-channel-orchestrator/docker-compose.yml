# Stack local H0.2: Kafka KRaft + topics del contrato + PostgreSQL + orquestador opcional.
# No hay compose en la raíz del programa; este archivo es autónomo para el orquestador.
# Si ya tenés Kafka de platform/wa-event-platform o gateway/wa-twilio-gateway, podés
# apuntar KAFKA_BOOTSTRAP_SERVERS=host.docker.internal:9092 y levantar solo el profile
# app (más orchestrator-db) con un override; por defecto se usa el broker de este compose.
# Desde platform/wa-channel-orchestrator:
#   docker compose up -d --wait                    # broker + kafka-init + postgres
#   docker compose --profile app up -d --wait      # + wa-channel-orchestrator
# H9 en el host: H9_BASE_URL=http://host.docker.internal:8099 (ver README y .env.example).
services:
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Topics de shared/contracts/events/topics.md (3 particiones, réplica 1, retención por tiempo).
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        BOOT=kafka:29092
        create() {
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$BOOT" --create --if-not-exists \
            --topic "$$1" --partitions 3 --replication-factor 1 \
            --config cleanup.policy=delete --config retention.ms="$$2"
        }
        create wa.message.received.v1 604800000
        create wa.message.ready-to-send.v1 604800000
        create wa.message.status.v1 2592000000
        create wa.message.dlq.v1 7776000000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$BOOT" --list

  orchestrator-db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wa_orchestrator}
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-}
    ports:
      - "127.0.0.1:${ORCHESTRATOR_DB_HOST_PORT:-5436}:5432"
    volumes:
      - orchestrator-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  wa-channel-orchestrator:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: platform/wa-channel-orchestrator/Dockerfile
    image: wa-channel-orchestrator:local
    ports:
      - "127.0.0.1:${SERVER_PORT:-8091}:8091"
    environment:
      SERVER_PORT: 8091
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SPRING_DATASOURCE_URL: jdbc:postgresql://orchestrator-db:5432/${POSTGRES_DB:-wa_orchestrator}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      ORCHESTRATOR_SAGA_STEP_TIMEOUT: ${ORCHESTRATOR_SAGA_STEP_TIMEOUT:-PT24H}
      SAGA_TIMEOUT_CHECK_INTERVAL_MS: ${SAGA_TIMEOUT_CHECK_INTERVAL_MS:-60000}
      H9_BASE_URL: ${H9_BASE_URL:-http://host.docker.internal:8099}
      H9_SERVICE_TOKEN: ${H9_SERVICE_TOKEN:-}
      H9_CONNECT_TIMEOUT_MS: ${H9_CONNECT_TIMEOUT_MS:-1000}
      H9_TIMEOUT_MS: ${H9_TIMEOUT_MS:-5000}
      H9_MAX_RETRIES: ${H9_MAX_RETRIES:-2}
      H9_BACKOFF_MS: ${H9_BACKOFF_MS:-200}
      OUTBOX_ENABLED: ${OUTBOX_ENABLED:-true}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-250}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-3}
      OUTBOX_BACKOFF_MS: ${OUTBOX_BACKOFF_MS:-1000}
      OUTBOX_SEND_TIMEOUT_MS: ${OUTBOX_SEND_TIMEOUT_MS:-10000}
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      orchestrator-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8091/actuator/health"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

volumes:
  kafka-data:
  orchestrator-db-data:
