# Stack local H0.1: Kafka KRaft + topics del contrato + app opcional.
# Desde platform/wa-event-platform:
#   docker compose up -d --wait                    # broker + kafka-init
#   docker compose --profile app up -d --wait      # + wa-event-platform
services:
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Topics de shared/contracts/events/topics.md (3 particiones, réplica 1, retención por tiempo).
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        BOOT=kafka:29092
        create() {
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$BOOT" --create --if-not-exists \
            --topic "$$1" --partitions 3 --replication-factor 1 \
            --config cleanup.policy=delete --config retention.ms="$$2"
        }
        create wa.message.received.v1 604800000
        create wa.message.ready-to-send.v1 604800000
        create wa.message.status.v1 2592000000
        create wa.message.dlq.v1 7776000000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$BOOT" --list

  wa-event-platform:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: platform/wa-event-platform/Dockerfile
    image: wa-event-platform:local
    ports:
      - "127.0.0.1:${SERVER_PORT:-8092}:8092"
    environment:
      SERVER_PORT: 8092
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_ADMIN_AUTO_CREATE: ${KAFKA_ADMIN_AUTO_CREATE:-true}
      KAFKA_ADMIN_FAIL_FAST: ${KAFKA_ADMIN_FAIL_FAST:-true}
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
      KAFKA_TOPIC_REPLICAS: ${KAFKA_TOPIC_REPLICAS:-1}
      KAFKA_RECEIVED_RETENTION: ${KAFKA_RECEIVED_RETENTION:-7d}
      KAFKA_READY_TO_SEND_RETENTION: ${KAFKA_READY_TO_SEND_RETENTION:-7d}
      KAFKA_STATUS_RETENTION: ${KAFKA_STATUS_RETENTION:-30d}
      KAFKA_DLQ_RETENTION: ${KAFKA_DLQ_RETENTION:-90d}
      KAFKA_PRODUCER_RETRIES: ${KAFKA_PRODUCER_RETRIES:-10}
      KAFKA_CONSUMER_GROUP_ID: ${KAFKA_CONSUMER_GROUP_ID:-wa-event-platform}
      KAFKA_CONSUMER_MAX_RETRIES: ${KAFKA_CONSUMER_MAX_RETRIES:-3}
      KAFKA_CONSUMER_RETRY_INITIAL_INTERVAL: ${KAFKA_CONSUMER_RETRY_INITIAL_INTERVAL:-1000}
      KAFKA_CONSUMER_RETRY_MAX_INTERVAL: ${KAFKA_CONSUMER_RETRY_MAX_INTERVAL:-10000}
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8092/actuator/health"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

volumes:
  kafka-data:
