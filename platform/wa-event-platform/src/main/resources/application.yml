server:
  port: ${SERVER_PORT:8092}
spring:
  application:
    name: wa-event-platform
  profiles:
    default: local
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 10
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual_immediate
      observation-enabled: true
    template:
      observation-enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
logging:
  structured:
    format:
      console: ecs
wa:
  topics:
    received: wa.message.received.v1
    ready-to-send: wa.message.ready-to-send.v1
    status: wa.message.status.v1
    dlq: wa.message.dlq.v1
    consumer-groups:
      gateway: wa-twilio-gateway
      orchestrator: wa-channel-orchestrator
      reference: wa-event-platform-reference
---
spring:
  config:
    activate:
      on-profile: local
  kafka:
    consumer:
      group-id: wa-event-platform-reference
---
spring:
  config:
    activate:
      on-profile: dev
  kafka:
    consumer:
      group-id: wa-event-platform-reference
---
spring:
  config:
    activate:
      on-profile: test
  kafka:
    consumer:
      group-id: wa-event-platform-reference
