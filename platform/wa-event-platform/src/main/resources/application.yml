server:
  port: ${SERVER_PORT:8092}
spring:
  application:
    name: wa-event-platform
  profiles:
    default: local
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      enable-auto-commit: false
    listener:
      ack-mode: manual_immediate
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
logging:
  structured:
    format:
      console: ecs
---
spring:
  config:
    activate:
      on-profile: local
---
spring:
  config:
    activate:
      on-profile: dev
---
spring:
  config:
    activate:
      on-profile: test
