openapi: 3.1.0
info:
  title: wa-accounts-service
  description: "Servicio de Cuentas (H4): cuentas, saldos, movimientos, terceros agendados\
    \ y transferencias con preparación y confirmación explícita. Cada operación valida\
    \ X-Credencial-Sesion con H2. Los ejemplos usan datos ficticios; reemplazar cuentas\
    \ e identificadores por datos del titular y la credencial por una sesión vigente."
  version: 0.1.0-SNAPSHOT
servers:
- url: http://localhost:8084
  description: Local
tags:
- name: Cuenta
  description: Operaciones del titular autenticado mediante H2
- name: Movimiento
  description: Operaciones del titular autenticado mediante H2
- name: Tercero
  description: Operaciones del titular autenticado mediante H2
- name: Transferencia
  description: Operaciones del titular autenticado mediante H2
paths:
  /api/v1/transferencias:
    post:
      tags:
      - Transferencia
      summary: Preparar transferencia
      description: "Valida sesión, saldo, límites, moneda y horario. Reserva fondos\
        \ sin débito. Indicar cuentaDestino propia o terceroId agendado, exclusivamente.\
        \ Expira en 5 minutos por defecto."
      operationId: preparar
      parameters:
      - name: X-Credencial-Sesion
        in: header
        description: JWT de sesión emitido por H2; se valida en cada solicitud
        required: false
        schema:
          type: string
          default: ""
        example: credencial-de-sesion-h2
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferenciaRequest"
            examples:
              Propia:
                description: Propia
                value:
                  cuentaOrigen: "001"
                  cuentaDestino: "002"
                  monto: 100.0
                  moneda: ARS
                  concepto: Transferencia
              Tercero:
                description: Tercero
                value:
                  cuentaOrigen: "001"
                  terceroId: 11111111-1111-4111-8111-111111111111
                  monto: 100.0
                  moneda: ARS
                  concepto: Transferencia
        required: true
      responses:
        "201":
          description: Preparar transferencia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferenciaPreparadaResponse"
              examples:
                Preparada:
                  $ref: "#/components/examples/Preparada"
        "400":
          description: Solicitud o parámetros inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                BadRequest:
                  $ref: "#/components/examples/BadRequest"
                ValidationError:
                  $ref: "#/components/examples/ValidationError"
        "404":
          description: Recurso inexistente o ajeno al titular
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                NotFound:
                  $ref: "#/components/examples/NotFound"
        "409":
          description: "Rechazo por saldo, límites, horario, moneda, destino o estado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                Conflict:
                  $ref: "#/components/examples/Conflict"
        "401":
          description: "Credencial ausente, expirada o revocada"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                Unauthorized:
                  $ref: "#/components/examples/Unauthorized"
        "500":
          description: Error interno o validación H2 no disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                InternalError:
                  $ref: "#/components/examples/InternalError"
  /api/v1/transferencias/{id}/confirmar:
    post:
      tags:
      - Transferencia
      summary: Confirmar transferencia
      description: Requiere CONFIRMAR literal. CONFIRMADA devuelve 200 sin débito
        y exige otra confirmación consecutiva; EJECUTADA incluye comprobante. Otra
        respuesta reinicia a PREPARADA y devuelve 409. Se revalidan vencimiento y
        reglas; destinos no locales se rechazan sin débito.
      operationId: confirmar
      parameters:
      - name: id
        in: path
        description: Identificador devuelto al preparar
        required: true
        schema:
          type: string
          format: uuid
        example: 22222222-2222-4222-8222-222222222222
      - name: X-Credencial-Sesion
        in: header
        description: JWT de sesión emitido por H2; se valida en cada solicitud
        required: false
        schema:
          type: string
          default: ""
        example: credencial-de-sesion-h2
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmarTransferenciaRequest"
            example:
              confirmacion: CONFIRMAR
        required: true
      responses:
        "400":
          description: JSON o UUID inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                BadRequest:
                  $ref: "#/components/examples/BadRequest"
        "404":
          description: Recurso inexistente o ajeno al titular
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                NotFoundTransferencia:
                  $ref: "#/components/examples/NotFoundTransferencia"
        "409":
          description: "Rechazo por saldo, límites, horario, moneda, destino o estado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                Conflict:
                  $ref: "#/components/examples/Conflict"
        "401":
          description: "Credencial ausente, expirada o revocada"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                Unauthorized:
                  $ref: "#/components/examples/Unauthorized"
        "500":
          description: Error interno o validación H2 no disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                InternalError:
                  $ref: "#/components/examples/InternalError"
        "200":
          description: Ejecutada o segunda confirmación pendiente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferenciaResponse"
              examples:
                Ejecutada:
                  $ref: "#/components/examples/Ejecutada"
                Confirmada:
                  $ref: "#/components/examples/Confirmada"
  /api/v1/terceros:
    get:
      tags:
      - Tercero
      summary: Listar terceros
      description: Devuelve solo los destinatarios activos agendados del titular;
        puede devolver una lista vacía.
      operationId: listar
      parameters:
      - name: X-Credencial-Sesion
        in: header
        description: JWT de sesión emitido por H2; se valida en cada solicitud
        required: false
        schema:
          type: string
          default: ""
        example: credencial-de-sesion-h2
      responses:
        "200":
          description: Listar terceros
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TerceroResponse"
              examples:
                Terceros:
                  $ref: "#/components/examples/Terceros"
        "401":
          description: "Credencial ausente, expirada o revocada"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                Unauthorized:
                  $ref: "#/components/examples/Unauthorized"
        "500":
          description: Error interno o validación H2 no disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                InternalError:
                  $ref: "#/components/examples/InternalError"
  /api/v1/cuentas:
    get:
      tags:
      - Cuenta
      summary: Listar cuentas
      description: Devuelve exclusivamente las cuentas del titular; puede devolver
        una lista vacía.
      operationId: listar_1
      parameters:
      - name: X-Credencial-Sesion
        in: header
        description: JWT de sesión emitido por H2; se valida en cada solicitud
        required: false
        schema:
          type: string
          default: ""
        example: credencial-de-sesion-h2
      responses:
        "200":
          description: Listar cuentas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CuentaResponse"
              examples:
                Cuentas:
                  $ref: "#/components/examples/Cuentas"
        "401":
          description: "Credencial ausente, expirada o revocada"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                Unauthorized:
                  $ref: "#/components/examples/Unauthorized"
        "500":
          description: Error interno o validación H2 no disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                InternalError:
                  $ref: "#/components/examples/InternalError"
  /api/v1/cuentas/{numero}/movimientos:
    get:
      tags:
      - Movimiento
      summary: Consultar movimientos
      description: Orden descendente por fecha e id. Ventana máxima configurable (90
        días por defecto). Sin fechas usa la ventana hasta ahora; al continuar conserva
        filtros y ventana del cursor.
      operationId: listar_2
      parameters:
      - name: X-Credencial-Sesion
        in: header
        description: JWT de sesión emitido por H2; se valida en cada solicitud
        required: false
        schema:
          type: string
        example: credencial-de-sesion-h2
      - name: numero
        in: path
        description: Número de cuenta del titular
        required: true
        schema:
          type: string
        example: "001"
      - name: desde
        in: query
        description: Inicio inclusivo ISO-8601 UTC
        required: false
        schema:
          type: string
          format: date-time
        example: 2026-10-01T00:00:00Z
      - name: hasta
        in: query
        description: Fin inclusivo ISO-8601 UTC
        required: false
        schema:
          type: string
          format: date-time
        example: 2026-10-27T12:00:00Z
      - name: tipo
        in: query
        description: Filtrar débitos o créditos
        required: false
        schema:
          type: string
          description: "DEBITO: egreso de fondos; CREDITO: ingreso de fondos"
          enum:
          - DEBITO
          - CREDITO
        example: DEBITO
      - name: limit
        in: query
        description: "Tamaño positivo, limitado al tope configurado (10 por defecto)"
        required: false
        schema:
          type: integer
          format: int32
        example: 10
      - name: cursor
        in: query
        description: Cursor opaco Base64 de la respuesta anterior; omitir en la primera
          página
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Consultar movimientos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovimientosPageResponse"
              examples:
                Movimientos:
                  $ref: "#/components/examples/Movimientos"
        "400":
          description: Solicitud o parámetros inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                BadRequest:
                  $ref: "#/components/examples/BadRequest"
        "404":
          description: Recurso inexistente o ajeno al titular
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                NotFoundMovimiento:
                  $ref: "#/components/examples/NotFoundMovimiento"
        "401":
          description: "Credencial ausente, expirada o revocada"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                Unauthorized:
                  $ref: "#/components/examples/Unauthorized"
        "500":
          description: Error interno o validación H2 no disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                InternalError:
                  $ref: "#/components/examples/InternalError"
  /api/v1/cuentas/{numeroCuenta}/saldo:
    get:
      tags:
      - Cuenta
      summary: Consultar saldo
      description: Devuelve saldo disponible y contable en la moneda de la cuenta
        propia.
      operationId: consultarSaldo
      parameters:
      - name: X-Credencial-Sesion
        in: header
        description: JWT de sesión emitido por H2; se valida en cada solicitud
        required: false
        schema:
          type: string
          default: ""
        example: credencial-de-sesion-h2
      - name: numeroCuenta
        in: path
        description: Número de cuenta del titular
        required: true
        schema:
          type: string
        example: "001"
      responses:
        "200":
          description: Consultar saldo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaldoResponse"
              examples:
                Saldo:
                  $ref: "#/components/examples/Saldo"
        "404":
          description: Recurso inexistente o ajeno al titular
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                NotFound:
                  $ref: "#/components/examples/NotFound"
        "401":
          description: "Credencial ausente, expirada o revocada"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                Unauthorized:
                  $ref: "#/components/examples/Unauthorized"
        "500":
          description: Error interno o validación H2 no disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                InternalError:
                  $ref: "#/components/examples/InternalError"
components:
  schemas:
    ErrorResponse:
      type: object
      description: "Error uniforme de la API (code, message, details, timestamp)"
      properties:
        code:
          type: string
          description: Código estable
          enum:
          - VALIDATION_ERROR
          - BAD_REQUEST
          - NOT_FOUND
          - CONFLICT
          - INTERNAL_ERROR
          - UNAUTHORIZED
          - FORBIDDEN
          example: VALIDATION_ERROR
        message:
          type: string
          description: Mensaje legible sin datos sensibles
          example: La solicitud tiene datos inválidos
        details:
          type: array
          description: Detalles de validación; nunca null (lista vacía si no aplica)
          items:
            $ref: "#/components/schemas/FieldError"
        timestamp:
          type: string
          format: date-time
          description: Instante UTC ISO-8601
          example: 2026-10-26T12:00:00Z
    TransferenciaRequest:
      type: object
      properties:
        cuentaOrigen:
          type: string
          description: Cuenta propia de origen; máximo 34 caracteres
          example: "001"
          maxLength: 34
          minLength: 0
        cuentaDestino:
          type: string
          description: Cuenta propia destino; excluyente con terceroId; máximo 34
            caracteres
          example: "002"
          maxLength: 34
          minLength: 0
        terceroId:
          type: string
          format: uuid
          description: Destinatario activo agendado; excluyente con cuentaDestino
          example: 11111111-1111-4111-8111-111111111111
        monto:
          type: number
          description: Monto positivo; hasta 17 enteros y 2 decimales
          example: 100.0
          minimum: 0.01
        moneda:
          type: string
          description: "Moneda de la operación: ARS o USD"
          enum:
          - ARS
          - USD
          example: ARS
        concepto:
          type: string
          description: Concepto opcional; máximo 255 caracteres
          example: Transferencia
          maxLength: 255
          minLength: 0
      required:
      - cuentaOrigen
      - moneda
      - monto
    TransferenciaPreparadaResponse:
      type: object
      properties:
        transferenciaId:
          type: string
          format: uuid
          description: Identificador devuelto por la preparación
          example: 22222222-2222-4222-8222-222222222222
        estado:
          type: string
          description: PREPARADA espera confirmación; CONFIRMADA espera la segunda;
            EJECUTADA tiene comprobante
          enum:
          - PREPARADA
          - CONFIRMADA
          - EJECUTADA
          - RECHAZADA
          - EXPIRADA
          example: PREPARADA
        resumen:
          type: string
          description: Resumen de la operación a confirmar
          example: Transferir 100.00 ARS desde ahorros a gastos
        requiereDobleConfirmacion:
          type: boolean
          description: Exige dos confirmaciones consecutivas antes del débito
          example: false
        expiraEn:
          type: string
          format: date-time
          description: Vencimiento ISO-8601 UTC de la preparación
          example: 2026-10-27T12:05:00Z
    FieldError:
      type: object
      description: Detalle de un campo inválido (sin el valor rechazado)
      properties:
        field:
          type: string
          description: Nombre del campo
          example: nombre
        message:
          type: string
          description: Motivo del rechazo
          example: El nombre es obligatorio
    ConfirmarTransferenciaRequest:
      type: object
      properties:
        confirmacion:
          type: string
          description: Enviar CONFIRMAR literal; otro valor reinicia la secuencia
            y devuelve 409
          example: CONFIRMAR
    ComprobanteResponse:
      type: object
      properties:
        fecha:
          type: string
          format: date-time
          description: Fecha ISO-8601 UTC
          example: 2026-10-27T12:00:00Z
        origen:
          type: string
          description: Número de cuenta origen
          example: "001"
        destino:
          type: string
          description: Número de cuenta destino
          example: "002"
        monto:
          type: number
          description: Importe en la moneda indicada
          example: 100.0
        moneda:
          type: string
          description: "Moneda de la operación: ARS o USD"
          enum:
          - ARS
          - USD
          example: ARS
        referencia:
          type: string
          description: Referencia de la operación ejecutada
          example: ref-001
    TransferenciaResponse:
      type: object
      properties:
        transferenciaId:
          type: string
          format: uuid
          description: Identificador devuelto por la preparación
          example: 22222222-2222-4222-8222-222222222222
        estado:
          type: string
          description: PREPARADA espera confirmación; CONFIRMADA espera la segunda;
            EJECUTADA tiene comprobante
          enum:
          - PREPARADA
          - CONFIRMADA
          - EJECUTADA
          - RECHAZADA
          - EXPIRADA
          example: EJECUTADA
        fechaEjecucion:
          type: string
          format: date-time
          description: Fecha ISO-8601 UTC; nula mientras resta confirmación
          example: 2026-10-27T12:01:00Z
        referencia:
          type: string
          description: Referencia de la operación ejecutada
          example: ref-001
        comprobante:
          $ref: "#/components/schemas/ComprobanteResponse"
          description: Comprobante; nulo hasta EJECUTADA
          example: {}
    TerceroResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Identificador del destinatario agendado
          example: 11111111-1111-4111-8111-111111111111
        alias:
          type: string
          description: Alias de la cuenta o destinatario
          example: ahorros
        numeroCuentaDestino:
          type: string
          description: Cuenta del destinatario
          example: "003"
        bancoDestino:
          type: string
          description: Banco del destinatario; puede estar ausente
          example: Banco local
    CuentaResponse:
      type: object
      properties:
        numeroCuenta:
          type: string
          description: Número de cuenta del titular
          example: "001"
        alias:
          type: string
          description: Alias de la cuenta o destinatario
          example: ahorros
        tipo:
          type: string
          description: "Tipo de cuenta: CA (caja de ahorro) o CC (cuenta corriente)"
          enum:
          - CA
          - CC
          example: CA
        moneda:
          type: string
          description: "Moneda de la operación: ARS o USD"
          enum:
          - ARS
          - USD
          example: ARS
    MovimientoResponse:
      type: object
      properties:
        fecha:
          type: string
          format: date-time
          description: Fecha ISO-8601 UTC
          example: 2026-10-27T12:00:00Z
        tipo:
          type: string
          description: "Sentido del movimiento: DEBITO (egreso) o CREDITO (ingreso)"
          enum:
          - DEBITO
          - CREDITO
          example: DEBITO
        monto:
          type: number
          description: Importe en la moneda indicada
          example: 100.0
        moneda:
          type: string
          description: "Moneda de la operación: ARS o USD"
          enum:
          - ARS
          - USD
          example: ARS
        descripcion:
          type: string
          description: Descripción del movimiento
          example: Transferencia
        referencia:
          type: string
          description: Referencia de la operación ejecutada
          example: ref-001
        saldoResultante:
          type: number
          description: Saldo contable luego del movimiento
          example: 14900.0
    MovimientosPageResponse:
      type: object
      properties:
        movimientos:
          type: array
          description: Movimientos ordenados por fecha e id descendentes
          example: []
          items:
            $ref: "#/components/schemas/MovimientoResponse"
        tieneMas:
          type: boolean
          description: Indica si quedan movimientos por consultar
          example: false
        cursor:
          type: string
          description: Cursor opaco; nulo al finalizar. Reutilizar sin modificar y
            conservar filtros
          example: null
    SaldoResponse:
      type: object
      properties:
        numeroCuenta:
          type: string
          description: Número de cuenta del titular
          example: "001"
        alias:
          type: string
          description: Alias de la cuenta o destinatario
          example: ahorros
        saldoDisponible:
          type: number
          description: Saldo disponible para operar
          example: 15000.0
        saldoContable:
          type: number
          description: Saldo contable registrado
          example: 15000.0
        moneda:
          type: string
          description: "Moneda de la operación: ARS o USD"
          enum:
          - ARS
          - USD
          example: ARS
  examples:
    Cuentas:
      value:
      - numeroCuenta: "001"
        alias: ahorros
        tipo: CA
        moneda: ARS
    Saldo:
      value:
        numeroCuenta: "001"
        alias: ahorros
        saldoDisponible: 15000
        saldoContable: 15000
        moneda: ARS
    Movimientos:
      value:
        movimientos:
        - fecha: 2026-10-27T12:00:00Z
          tipo: DEBITO
          monto: 100
          moneda: ARS
          descripcion: Transferencia
          referencia: ref-001
          saldoResultante: 14900
        tieneMas: false
        cursor: null
    Terceros:
      value:
      - id: 11111111-1111-4111-8111-111111111111
        alias: Ana
        numeroCuentaDestino: "003"
        bancoDestino: Banco local
    Preparada:
      value:
        transferenciaId: 22222222-2222-4222-8222-222222222222
        estado: PREPARADA
        resumen: Transferir 100.00 ARS desde ahorros a gastos
        requiereDobleConfirmacion: false
        expiraEn: 2026-10-27T12:05:00Z
    Ejecutada:
      value:
        transferenciaId: 22222222-2222-4222-8222-222222222222
        estado: EJECUTADA
        fechaEjecucion: 2026-10-27T12:01:00Z
        referencia: ref-001
        comprobante:
          fecha: 2026-10-27T12:01:00Z
          origen: "001"
          destino: "002"
          monto: 100
          moneda: ARS
          referencia: ref-001
    Confirmada:
      value:
        transferenciaId: 22222222-2222-4222-8222-222222222222
        estado: CONFIRMADA
        fechaEjecucion: null
        referencia: null
        comprobante: null
    ValidationError:
      value:
        code: VALIDATION_ERROR
        message: La solicitud tiene datos inválidos
        details:
        - field: cuentaOrigen
          message: no debe estar vacío
        timestamp: 2026-10-27T12:00:00Z
    BadRequest:
      value:
        code: BAD_REQUEST
        message: La solicitud no es válida
        details: []
        timestamp: 2026-10-27T12:00:00Z
    Unauthorized:
