spring:
  application:
    name: wa-accounts-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wa_accounts}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}

server:
  port: ${PORT:8084}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs.path: /v3/api-docs
  swagger-ui.path: /swagger-ui.html

limits:
  movimientos:
    ventana-dias: ${MOVIMIENTOS_VENTANA_DIAS:90}
    tope-por-mensaje: ${MOVIMIENTOS_TOPE_POR_MENSAJE:10}

clients:
  wa-credentials-service:
    base-url: ${CREDENTIALS_SERVICE_BASE_URL:http://localhost:8082}
    connect-timeout: ${CREDENTIALS_CONNECT_TIMEOUT:2s}
    read-timeout: ${CREDENTIALS_READ_TIMEOUT:5s}
