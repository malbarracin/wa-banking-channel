spring:
  application:
    name: wa-accounts-service
  datasource:
    url: jdbc:h2:mem:wa_accounts;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop

server:
  port: 8084
  error:
    include-stacktrace: never
    include-message: never

clients:
  wa-credentials-service:
    base-url: http://localhost:8082
    connect-timeout: 2s
    read-timeout: 5s
