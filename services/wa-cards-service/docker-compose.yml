services:
  app:
    build: .
    image: wa-cards-service:local
    container_name: ${APP_NAME:-wa-cards-service}
    ports:
      - "${APP_PORT:-8086}:8086"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      PORT: 8086
      APP_PORT: 8086
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # H2 en host (perfil docker); ajustar si wa-credentials corre en la misma red Compose
      CREDENTIALS_SERVICE_BASE_URL: ${CREDENTIALS_SERVICE_BASE_URL:-http://host.docker.internal:8082}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8086/actuator/health"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_HOST_PORT:-5437}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
