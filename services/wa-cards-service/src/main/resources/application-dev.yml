spring:
  datasource:
    # Postgres del compose en localhost (DB_HOST_PORT por defecto 5437)
    url: ${DB_URL:jdbc:postgresql://localhost:5437/wa_cards}
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD:cambiar}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}

server:
  port: ${APP_PORT:8086}

clients:
  wa-credentials-service:
    base-url: ${CREDENTIALS_SERVICE_BASE_URL:http://localhost:8082}
