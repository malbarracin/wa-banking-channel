spring:
  application:
    name: wa-cards-service
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wa_cards}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: ${PORT:8086}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

clients:
  wa-credentials-service:
    base-url: ${CREDENTIALS_SERVICE_BASE_URL:http://localhost:8082}
    connect-timeout: ${CREDENTIALS_CONNECT_TIMEOUT:2s}
    read-timeout: ${CREDENTIALS_READ_TIMEOUT:5s}

cards:
  aviso-viaje:
    recomendaciones: ${CARDS_AVISO_VIAJE_RECOMENDACIONES:Usá canales oficiales y no compartas tus claves.}
  bloqueo:
    validacion-adicional-requerida: ${CARDS_BLOQUEO_VALIDACION_ADICIONAL_REQUERIDA:true}
  consumos:
    ventana-dias: ${CARDS_CONSUMOS_VENTANA_DIAS:90}
    tope-por-mensaje: ${CARDS_CONSUMOS_TOPE_POR_MENSAJE:10}

springdoc:
  api-docs.path: /v3/api-docs
  swagger-ui.path: /swagger-ui.html
  default-produces-media-type: application/json
