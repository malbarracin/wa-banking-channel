services:
  app:
    build: .
    image: wa-channel-service:local
    container_name: ${APP_NAME:-wa-channel-service}
    ports:
      - "${APP_PORT:-8081}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      PORT: 8081
      APP_PORT: 8081
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # H1 en host (perfil docker); ajustar si wa-users corre en la misma red Compose
      WA_USERS_SERVICE_BASE_URL: ${WA_USERS_SERVICE_BASE_URL:-http://host.docker.internal:8080}
      CREDENCIALES_SERVICE_BASE_URL: ${CREDENCIALES_SERVICE_BASE_URL:-http://host.docker.internal:8082}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Esquema explícito (ddl-auto=none): se aplica solo en el primer arranque del volume
      - ./src/main/resources/db/postgresql/V001__vinculo.sql:/docker-entrypoint-initdb.d/V001__vinculo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
