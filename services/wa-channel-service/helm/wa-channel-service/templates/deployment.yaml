apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wa-channel-service.fullname" . }}
  labels:
    {{- include "wa-channel-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "wa-channel-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wa-channel-service.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: wa-channel-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.spring.profiles.active | quote }}
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "wa-channel-service.fullname" . }}-config
                  key: DB_URL
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "wa-channel-service.fullname" . }}-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "wa-channel-service.fullname" . }}-secret
                  key: DB_PASSWORD
            - name: CREDENTIAL_H3_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "wa-channel-service.fullname" . }}-secret
                  key: CREDENTIAL_H3_SERVICE_TOKEN
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 40
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
