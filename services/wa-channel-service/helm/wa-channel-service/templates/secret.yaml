apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wa-channel-service.fullname" . }}-secret
  labels:
    {{- include "wa-channel-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Valores vía --set o external-secrets; no commitear secretos reales
  DB_USERNAME: {{ .Values.env.DB_USERNAME | default "app" | quote }}
  DB_PASSWORD: {{ required "env.DB_PASSWORD es obligatorio; proporcione una credencial explícita" .Values.env.DB_PASSWORD | quote }}
