apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-channel
  labels:
    app.kubernetes.io/name: {{ include "wa-channel.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "wa-channel.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
