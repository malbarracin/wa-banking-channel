replicaCount: 1

image:
  repository: ghcr.io/example/wa-channel-service
  tag: "0.1.0-SNAPSHOT"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8081

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

spring:
  profiles:
    active: prod

env:
  DB_URL: jdbc:postgresql://postgres:5432/wa_channel
  DB_USERNAME: app
  # DB_PASSWORD y CREDENTIAL_H3_SERVICE_TOKEN via Secret (obligatorios; sin default)

ingress:
  enabled: false
  host: wa-channel.example.local
