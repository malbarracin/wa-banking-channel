spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}

server:
  port: ${APP_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
