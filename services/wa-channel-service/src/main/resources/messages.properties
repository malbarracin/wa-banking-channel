# Textos al cliente (sección 8). Placeholders: {0}=banco, {1}=soporte/URL/intentos/nombre según el mensaje.
# Ningún placeholder admite bindingId, token, clientId ni datos de verificación.

channel.message.terms.rejected=Entendido. Sin aceptar las condiciones no podemos vincular tu WhatsApp. \
Cuando quieras retomar, escribinos de nuevo.

channel.message.client.not.found=No encontramos tus datos como cliente del {0}. Para operar por WhatsApp \
