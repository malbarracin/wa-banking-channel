spring:
  datasource:
    url: jdbc:h2:mem:wa_channel;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  messages:
    basename: messages
    encoding: UTF-8

bank:
  channel:
    verification:
      policy: document-code
      max-attempts: 3
      window-minutes: 60
    name: Banco Demo
    support-phone: "0800-123-4567"
    onboarding-url: "https://banco.example/alta"
    internal-roles:
      support: support
      bank-policy: bank-policy
    users-service:
      base-url: http://localhost:18081
      timeout-ms: 2500
