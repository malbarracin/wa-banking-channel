services:
  app:
    build: .
    image: wa-credentials-service:local
    container_name: ${APP_NAME:-wa-credentials-service}
    ports:
      - "${APP_PORT:-8082}:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      PORT: 8082
      APP_PORT: 8082
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CREDENTIAL_JWT_SECRET: ${CREDENTIAL_JWT_SECRET}
      CREDENTIAL_H3_SERVICE_TOKEN: ${CREDENTIAL_H3_SERVICE_TOKEN}
      CREDENTIAL_BANK_SERVICE_TOKEN: ${CREDENTIAL_BANK_SERVICE_TOKEN}
      # H1 en host (perfil docker); ajustar si wa-users corre en la misma red Compose
      WA_USERS_SERVICE_BASE_URL: ${WA_USERS_SERVICE_BASE_URL:-http://host.docker.internal:8080}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_HOST_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
