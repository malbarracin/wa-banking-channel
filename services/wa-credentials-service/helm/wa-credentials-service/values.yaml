replicaCount: 1

image:
  repository: ghcr.io/example/wa-credentials-service
  tag: "0.1.0-SNAPSHOT"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8082

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

spring:
  profiles:
    active: prod

env:
  DB_URL: jdbc:postgresql://postgres:5432/wa_credentials
  DB_USERNAME: app
  # DB_PASSWORD, CREDENTIAL_JWT_SECRET, CREDENTIAL_H3_SERVICE_TOKEN y
  # CREDENTIAL_BANK_SERVICE_TOKEN via Secret (obligatorios; sin default)
  WA_USERS_SERVICE_BASE_URL: http://wa-users-service:8080

ingress:
  enabled: false
  host: wa-credentials.example.local
