spring:
  application:
    name: wa-credentials-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wa_credentials}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

server:
  port: ${PORT:8082}
  error:
    include-stacktrace: never
    include-message: never

credencial:
  jwt:
    secret: ${CREDENTIAL_JWT_SECRET:}

clients:
  wa-users-service:
    base-url: ${WA_USERS_SERVICE_BASE_URL:http://localhost:8080}
    connect-timeout: ${WA_USERS_SERVICE_CONNECT_TIMEOUT:1s}
    read-timeout: ${WA_USERS_SERVICE_READ_TIMEOUT:2s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: false
