replicaCount: 1

image:
  repository: ghcr.io/example/wa-insurance-service
  tag: "0.1.0-SNAPSHOT"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8085

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

spring:
  profiles:
    active: prod

env:
  DB_URL: jdbc:postgresql://postgres:5432/wa_insurance
  DB_USERNAME: app
  # DB_PASSWORD via Secret (obligatorio; sin default)
  CREDENTIALS_SERVICE_BASE_URL: http://wa-credentials-service:8082

ingress:
  enabled: false
  host: wa-insurance.example.local
