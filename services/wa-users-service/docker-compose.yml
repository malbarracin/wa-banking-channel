name: ${APP_NAME:-wa-users-service}
services:
  app:
    build: .
    image: ${APP_NAME:-wa-users-service}:local
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      PORT: "8080"
      DB_NAME: ${DB_NAME:?Definir DB_NAME}
      DB_USERNAME: ${DB_USERNAME:?Definir DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      start_period: 60s
      retries: 3
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?Definir DB_NAME}
      POSTGRES_USER: ${DB_USERNAME:?Definir DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres-data:
