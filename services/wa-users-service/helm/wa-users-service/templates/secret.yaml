{{- if .Values.database.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "users.secret" . }}
  labels:
    {{- include "users.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_URL: {{ required "database.url es obligatorio" .Values.database.url | quote }}
  DB_USERNAME: {{ required "database.username es obligatorio" .Values.database.username | quote }}
  DB_PASSWORD: {{ required "database.password es obligatorio" .Values.database.password | quote }}
{{- end }}
