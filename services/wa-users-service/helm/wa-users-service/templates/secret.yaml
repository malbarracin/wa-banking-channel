{{- if and .Values.database.secret.create (not .Values.database.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wa-users-service.dbSecretName" . }}
  labels:
    {{- include "wa-users-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "database.secret.url es obligatorio" .Values.database.secret.url | quote }}
  DATABASE_USERNAME: {{ required "database.secret.username es obligatorio" .Values.database.secret.username | quote }}
  DATABASE_PASSWORD: {{ required "database.secret.password es obligatorio" .Values.database.secret.password | quote }}
{{- end }}
