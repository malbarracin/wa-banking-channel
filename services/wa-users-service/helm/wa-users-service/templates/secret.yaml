{{- if .Values.database.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wa-users.secret" . }}
  labels:
    {{- include "wa-users.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_URL: {{ required "database.url is required" .Values.database.url | quote }}
  DB_USERNAME: {{ required "database.username is required" .Values.database.username | quote }}
  DB_PASSWORD: {{ required "database.password is required" .Values.database.password | quote }}
{{- end }}
