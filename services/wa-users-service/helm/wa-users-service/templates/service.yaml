apiVersion: v1
kind: Service
metadata:
  name: {{ include "wa-users.fullname" . }}
  labels:
    {{- include "wa-users.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "wa-users.labels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
