replicaCount: 2

# Obligatorio: proporcionar env.DB_PASSWORD desde un archivo de valores privado
# o mediante --set-file env.DB_PASSWORD=<archivo-de-credencial>.
# Sin ese valor, el renderizado falla en templates/secret.yaml.

image:
  pullPolicy: Always

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

spring:
  profiles:
    active: prod

ingress:
  enabled: false
