replicaCount: 1

image:
  repository: ghcr.io/example/wa-users-service
  tag: "0.1.0-SNAPSHOT"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

spring:
  profiles:
    active: prod

env:
  DB_URL: jdbc:postgresql://postgres:5432/wa_users
  DB_USERNAME: app
  # DB_PASSWORD via Secret

ingress:
  enabled: false
  host: wa-users.example.local
