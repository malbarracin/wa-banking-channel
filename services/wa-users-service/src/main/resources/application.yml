spring:
  application:
    name: wa-users-service
  profiles:
    active: local
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/wa_users}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      show-components: when_authorized
      probes:
        enabled: true
  health:
    mongo:
      enabled: true
    diskspace:
      enabled: true
      threshold: 10MB
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: WhatsApp Banking Channel — Users Service
    version: 0.0.1-SNAPSHOT
    encoding: UTF-8
    java:
      version: ${java.version}
  contact:
    team: Ingenia
    email: marcelo.albarracin@ingenia.la

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

api:
  versioning:
    enabled: true
    default-version: v1
    supported-versions:
      - v1

logging:
  level:
    root: INFO
    com.bcra.ws.users: DEBUG

---
spring:
  config:
    activate:
      on-profile: local
  data:
    mongodb:
      uri: mongodb://localhost:27017/wa_users

---
spring:
  config:
    activate:
      on-profile: docker
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://mongo:27017/wa_users}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
