spring:
  application:
    name: wa-users-service
  profiles:
    default: local
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/wa_users}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      show-components: when_authorized
      probes:
        enabled: true
  health:
    mongo:
      enabled: true
    diskspace:
      enabled: true
      threshold: 10MB
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: WhatsApp Banking Channel — Users Service
    version: 0.0.1-SNAPSHOT
    encoding: UTF-8
    java:
      version: ${java.version}
  contact:
    team: Ingenia
    email: marcelo.albarracin@ingenia.la

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

users:
  query:
    full-view-actors: ${USERS_QUERY_FULL_VIEW_ACTORS:BUSINESS_OPERATIONS,SUPPORT}

api:
  versioning:
    enabled: true
    default-version: v1
    supported-versions:
      - v1

logging:
  level:
    root: INFO
    com.bcra.ws.users: INFO
